name: Android release

# Builds Pardes, the Android app based on Zayit (androidApp/), and publishes the APK as a GitHub release marked Latest,
# so it shows in the repository's sidebar (a pre-release never does), with the build's complete source beside it.
# Tag android-<versionName>-<run number> (e.g. android-0.2.0-7), APK pardes-<tag>.apk. Run numbers only grow, so tags
# sort by version and then by build; a re-run of a run that already released gets -r<attempt> instead of colliding.
# The desktop workflows inherited from Zayit (deploy.yaml, pages.yaml, update-download-count.yaml) were removed: they
# would publish Zayit-branded installers or Zayit's own site from this repository. Pardes for desktop has its own,
# desktop-release.yml (desktop-* tags, never Latest).
# The APK is signed with Pardes's own key, kept only in the repository's secrets (PARDES_KEYSTORE_BASE64,
# PARDES_KEYSTORE_PASSWORD, PARDES_KEY_ALIAS, PARDES_KEY_PASSWORD), never with the debug key in the repository, which
# would let anyone sign an "update". No release without it: the APK's certificate must be RELEASE_CERT_SHA256.
# Installed Pardes (0.3.0 and later) updates itself from these releases (androidApp/.../update/AppReleases.kt): it reads
# the tag, the APK's name and its sha256 digest, installs only an APK with the installed app's certificate, and offers a
# release only when its versionName is higher than the installed one. Keep the names, and raise versionName every time.

# Runs only by hand, never on a push: Actions › Android release › Run workflow (on main, the default branch).
# "prerelease" publishes a build for testers instead: a GitHub pre-release, not Latest, which installed apps never offer
# as an update (AppReleases.kt skips pre-releases), and the download site does not offer it while a stable release exists
# (androidApp/site/index.html); testers take it from the releases page.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release for testers (installed apps do not offer it, not marked Latest)'
        type: boolean
        default: false
      note:
        description: 'Optional paragraph at the top of the release notes (e.g. what was tested)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # SHA-256 of the release key's certificate, as apksigner prints it (also in the release notes, for checking a download)
  RELEASE_CERT_SHA256: 293bf2a28ff954ef624cbee0292deb5b0d23819a93d4122a33483e2bc2d52772

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build APK and release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Android compiles SeforimLibrary from the repository's submodule, at the commit desktop Zayit 0.6.11 builds with
      # (4f07145). SeforimAcronymizer is the desktop's only.
      - name: Check out SeforimLibrary
        run: git submodule update --init SeforimLibrary

      # The release notes say what is new from this version's section of androidApp/CHANGELOG.md ("## <versionName> ·
      # <date>", which the site shows too), its "###" headings one level down. No release of a version the changelog
      # does not describe; checked before the half-hour build.
      - name: What's new in this version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' androidApp/app/build.gradle.kts)"
          [ -n "$version" ] || { echo "versionName not found in androidApp/app/build.gradle.kts" >&2; exit 1; }
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v "") { found = 1; next } }
            found && !/^<\/?div/ { print }
          ' androidApp/CHANGELOG.md | sed 's/^### /#### /' > "$RUNNER_TEMP/whatsnew.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/whatsnew.md" \
            || { echo "androidApp/CHANGELOG.md has no section \"## $version\": write what is new in it first" >&2; exit 1; }
          cat "$RUNNER_TEMP/whatsnew.md"

      # Installed apps offer a release as an update only for a higher versionName: say so (without stopping) when this
      # one is not higher than the newest published.
      - name: Newer than the published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' androidApp/app/build.gradle.kts)"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::warning::versionName $version is not digits and dots: installed apps will not see this release"
          fi
          latest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName' \
            | sed -n 's/^android-\([0-9][0-9.]*\)-[0-9].*$/\1/p' | sort -V | tail -1 || true)"
          highest="$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)"
          if [ -n "$latest" ] && { [ "$latest" = "$version" ] || [ "$highest" != "$version" ]; }; then
            echo "::warning::versionName $version is not higher than the published $latest: installed apps will not offer this release as an update"
          fi

      # JDK 21: lucene-android compiles against lucene-core's Java 21 class files.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      # basic: the open-source (MIT) cache provider, no extra terms. Not read-only, so a run started from another
      # branch than the default one still writes the cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > androidApp/local.properties

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PARDES_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "The PARDES_KEYSTORE_BASE64 secret is missing: no release with the debug key" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/pardes-release.jks"
          echo "PARDES_KEYSTORE=$RUNNER_TEMP/pardes-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: androidApp
        env:
          PARDES_KEYSTORE_PASSWORD: ${{ secrets.PARDES_KEYSTORE_PASSWORD }}
          PARDES_KEY_ALIAS: ${{ secrets.PARDES_KEY_ALIAS }}
          PARDES_KEY_PASSWORD: ${{ secrets.PARDES_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      # The APK must carry the release key's certificate: a build that fell back to the debug key is never published
      - name: Check the APK's signature
        run: |
          # The build-tools AGP fetched for the build (35.0.0 with AGP 8.12), else installed here
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ ! -x "$apksigner" ]; then
            sdkmanager --install "build-tools;35.0.0" > /dev/null
            apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fi
          [ -x "$apksigner" ] || { echo "apksigner not found under $ANDROID_HOME/build-tools" >&2; exit 1; }
          "$apksigner" verify --print-certs androidApp/app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256$" signature.txt \
            || { echo "The APK is not signed with the release key ($RELEASE_CERT_SHA256)" >&2; exit 1; }
          rm -f "$RUNNER_TEMP/pardes-release.jks"

      # Every reference above API 26 would be a NoClassDefFoundError/NoSuchMethodError on Android 8.0: no release unless 0.
      # The gate dexes with AGP's own D8 (in the Gradle cache after the build) for the app's minSdk (26) and traces
      # against the API 26 platform.
      - name: Check lucene-android against API 26
        run: |
          set -o pipefail
          sdkmanager --install "platforms;android-26" > /dev/null
          androidApp/lucene-android/check-min-api.sh androidApp/lucene-android/build/libs/lucene-android-*-android.jar \
            | tee check-min-api.txt
          grep -q ': 0 references above API 26, 0 missing on API 33, 0 missing on API 26$' check-min-api.txt
          grep -q 'run on API 33+ only): 0 references above API 33, 0 missing on API 33$' check-min-api.txt
          { echo '### lucene-android API 26 gate'; echo '```'; cat check-min-api.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # R8 must leave lucene-android's API 33 calls in AndroidCompatApi33: moved into a class every search loads, they
      # made Android 11's verifier reject it (no search there)
      - name: Check the release dex for lucene-android's API 33 class
        run: |
          androidApp/lucene-android/check-release-dex.sh androidApp/app/build/outputs/apk/release/app-release.apk \
            androidApp/app/build/outputs/mapping/release/mapping.txt

      - name: Name the release
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' androidApp/app/build.gradle.kts)"
          [ -n "$version" ] || { echo "versionName not found in androidApp/app/build.gradle.kts" >&2; exit 1; }
          tag="android-$version-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" > /dev/null 2>&1; then tag="$tag-r$GITHUB_RUN_ATTEMPT"; fi
          apk="pardes-$tag.apk"
          cp androidApp/app/build/outputs/apk/release/app-release.apk "$apk"
          # AGPL §6: the APK's Corresponding Source. GitHub's own "Source code" archives leave out submodules, and the
          # build compiles SeforimLibrary, so this archive adds it at its path.
          src="pardes-$tag-source.tar.gz"
          git archive --prefix="pardes-$tag/" -o source.tar HEAD
          git -C SeforimLibrary archive --prefix="pardes-$tag/SeforimLibrary/" \
            -o "$GITHUB_WORKSPACE/submodule.tar" HEAD
          tar --concatenate -f source.tar submodule.tar
          gzip -n -9 -c source.tar > "$src"
          (cd androidApp/tools && zip -q -X "$GITHUB_WORKSPACE/push-desktop-library-windows.zip" push-desktop-library.cmd push-desktop-library.ps1)
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "apk=$apk"
            echo "src=$src"
            echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.name.outputs.version }}
          TAG: ${{ steps.name.outputs.tag }}
          APK: ${{ steps.name.outputs.apk }}
          SRC: ${{ steps.name.outputs.src }}
          SHA256: ${{ steps.name.outputs.sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTE: ${{ inputs.note }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            kind=--prerelease
            title_suffix=", גרסת ניסיון"
            pre="**גרסת ניסיון לבודקים.** פרדס המותקן לא מציע אותה כעדכון, והיא לא מסומנת כגרסה האחרונה. מתקינים אותה ידנית מהקבצים שלמטה."
          else
            kind=--latest
            title_suffix=""
            pre=""
          fi
          cat > notes.md <<EOF
          $pre

          $NOTE

          פרדס הוא יישום לאנדרואיד ללימוד התורה, המבוסס על [זית](https://github.com/kdroidFilter/Zayit) מאת אליהו גמבש ואינו מטעמו: הוא לא יצר אותו, אינו אחראי לו ואינו נותן לו תמיכה, ולכן אין לפנות אליו או לפרויקט זית בבעיות שלו. פרדס נבנה מהקוד הפתוח של זית 0.6.11 ושונה כדי לפעול באנדרואיד, ומופץ תחת אותו רישיון, AGPL-3.0. קוד המקור המלא של בנייה זו, כולל SeforimLibrary, מצורף למטה (\`$SRC\`).

          ### מה חדש בגרסה $VERSION
          $(cat "$RUNNER_TEMP/whatsnew.md")

          כל הגרסאות ב[יומן השינויים]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/androidApp/CHANGELOG.md) ובאתר ההורדה, https://efrul.github.io/Pardes/#changelog

          ### התקנה
          - דרוש Android 8.0 ומעלה. עדכון מצטבר של הספרייה דורש Android 11 ומעלה, והווידג'טים למסך הבית של הטלפון Android 12 ומעלה.
          - מורידים את \`$APK\` מהקבצים שלמטה, פותחים אותו בטלפון ומאשרים התקנה מהמקור שממנו נפתח.
          - ה-APK חתום במפתח החתימה של פרדס, וכל גרסה מותקנת מעל הקודמת. טביעת האצבע (SHA-256) של התעודה: \`$RELEASE_CERT_SHA256\`.
          - מגרסה 0.3.0 פרדס מתעדכן מתוכו: בהפעלה הראשונה אחרי שיוצאת גרסה חדשה הוא מודיע עליה (בסרגל העליון ובהגדרות › כללי), ובאישורכם מוריד אותה ומתקין אותה מעל הקיימת; הספרייה וההגדרות נשמרות.

          ### הספרייה
          - בהפעלה הראשונה האפליקציה מורידה את ספריית הספרים שזית למחשב משתמש בה (כ-5.5 GB, ונדרשים כ-14.1 GB פנויים).
          - אפשר לשמור את הספרייה בכרטיס זיכרון: במדריך ההגדרה, כשיש כרטיס במכשיר, או אחר כך בהגדרות › ניהול נתונים › מיקום הספרייה.
          - מחשב שזית למחשב מותקן בו יכול להעביר את הספרייה שלו לטלפון דרך adb, בלי הורדה ובלי root (לא באנדרואיד 11, שם מתקינים מקובצי המאגר במכשיר). ב-Windows מחלצים את \`push-desktop-library-windows.zip\` לתיקייה (לחיצה ימנית › חלץ הכול) ולוחצים פעמיים על \`push-desktop-library.cmd\` שבה; ב-Linux/macOS מריצים \`bash push-desktop-library.sh\`. שניהם מצורפים כאן ונמצאים גם ב-\`androidApp/tools\` שבקוד המקור. דרוש adb (Android SDK Platform-Tools של Google). להעתקה ישר לכרטיס הזיכרון: \`-SdCard\` ב-Windows (\`push-desktop-library.cmd -SdCard\` משורת הפקודה), \`--sdcard\` ב-Linux/macOS.
          - בלי אינטרנט אפשר לעדכן את הספרייה מקבצים שהועברו למכשיר: הגדרות › ניהול נתונים › עדכון מקבצים.

          ---
          Copyright (C) 2025 Elie Gambache. GNU AGPL v3 with an additional attribution term (§7b), see [LICENSE]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/LICENSE).
          Powered by the technologies that drive Zayit — https://zayitapp.com/

          נבנה מ-commit \`$GITHUB_SHA\`. SHA-256 של ה-APK: \`$SHA256\`
          EOF
          gh release create "$TAG" "$APK" "$SRC" \
            push-desktop-library-windows.zip androidApp/tools/push-desktop-library.sh \
            --target "$GITHUB_SHA" \
            --title "פרדס $VERSION (בנייה $GITHUB_RUN_NUMBER$title_suffix) – מבוסס על זית" \
            --notes-file notes.md \
            "$kind"
          echo "Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG): \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
