# The download site of Pardes, the Android app based on Zayit (androidApp/site), on GitHub Pages, with the desktop-to-phone
# transfer scripts next to it (and push-desktop-library-windows.zip, the .ps1 with its .cmd launcher) so the page can
# offer them as downloads. The APK itself comes from the releases that
# android-release.yml publishes: the deploy writes the newest one to latest.json, and runs again after every successful
# release, so the page needs no GitHub API call of its own (60 per hour per IP, often shared behind filtering proxies).
name: Android site

on:
  push:
    branches: [main]
    paths:
      - 'androidApp/site/**'
      - 'androidApp/tools/push-desktop-library.ps1'
      - 'androidApp/tools/push-desktop-library.sh'
      - 'androidApp/tools/push-desktop-library.cmd'
      - '.github/workflows/android-site.yml'
  workflow_run:
    workflows: [Android release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/tools
          cp -r androidApp/site/. _site/
          cp androidApp/tools/push-desktop-library.ps1 androidApp/tools/push-desktop-library.sh _site/tools/
          # Windows: the .ps1 with its double-click launcher, in one download.
          (cd androidApp/tools && zip -q -X "$GITHUB_WORKSPACE/_site/tools/push-desktop-library-windows.zip" push-desktop-library.cmd push-desktop-library.ps1)
          touch _site/.nojekyll

      - name: Newest release for the page (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '
            [.[] | select(.draft | not) | select(any(.assets[]; .name | (startswith("pardes-") and endswith(".apk"))))][0] // empty
            | {name, tag_name, prerelease, published_at, html_url,
               asset: ([.assets[] | select(.name | (startswith("pardes-") and endswith(".apk")))][0] | {name, size, browser_download_url, digest})}
          ' > _site/latest.json
          cat _site/latest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
