# The download site of Pardes, the Android app based on Zayit, and of Pardes for desktop (androidApp/site), on GitHub Pages, with the desktop-to-phone
# transfer scripts next to it (and push-desktop-library-windows.zip, the .ps1 with its .cmd launcher) so the page can
# offer them as downloads, and androidApp/CHANGELOG.md as changelog.md for its changelog. The APK, the version and the
# download count come from the releases that android-release.yml publishes. The page asks the GitHub API for them on
# every visit, so the count is current; releases.json, written here at every deploy (and the deploy runs again after
# every successful release), is what it shows when that call fails: 60 calls per hour per IP, often shared behind
# filtering proxies, and some filters block api.github.com.
# downloads.json is the same for the page's other downloads: Pardes for desktop's newest installers (desktop-release.yml),
# the semantic search's zips and the library's files (SeforimLibrary's latest release).
# The app reads releases.json and changelog.md too, the same way, to update itself (androidApp/.../update/AppReleases.kt),
# and Pardes for desktop reads semantic.json, the semantic packs (semantic-release.yml), when it can't reach the API
# (SeforimApp/.../features/search/semantic/pack/SemanticPackReleases.kt): keep their shapes.
name: Android site

on:
  push:
    branches: [main]
    paths:
      - 'androidApp/site/**'
      - 'androidApp/tools/push-desktop-library.ps1'
      - 'androidApp/tools/push-desktop-library.sh'
      - 'androidApp/tools/push-desktop-library.cmd'
      - 'androidApp/CHANGELOG.md'
      - '.github/workflows/android-site.yml'
  workflow_run:
    workflows: [Android release, Semantic pack release, Desktop release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/tools
          cp -r androidApp/site/. _site/
          cp androidApp/tools/push-desktop-library.ps1 androidApp/tools/push-desktop-library.sh _site/tools/
          cp androidApp/CHANGELOG.md _site/changelog.md
          # Windows: the .ps1 with its double-click launcher, in one download.
          (cd androidApp/tools && zip -q -X "$GITHUB_WORKSPACE/_site/tools/push-desktop-library-windows.zip" push-desktop-library.cmd push-desktop-library.ps1)
          touch _site/.nojekyll

      # Every release with a Pardes APK, newest first as the API lists them, in the API's own shape (only the APK assets
      # kept), so the page reads it as it reads the API.
      - name: Releases for the page (releases.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -s '
            def apk: .name | (startswith("pardes-") and endswith(".apk"));
            { generated_at: (now | todate),
              releases: [ add[] | select(.draft | not) | select(any(.assets[]; apk))
                | {name, tag_name, prerelease, published_at, html_url,
                   assets: [.assets[] | select(apk) | {name, size, browser_download_url, digest, download_count}]} ] }
          ' > _site/releases.json
          jq -c '{generated_at, releases: (.releases | length), downloads: ([.releases[].assets[].download_count] | add)}' _site/releases.json

      # Every semantic pack, in the API's shape too (only the bundle's files: the manifest and its parts)
      - name: Semantic packs for the desktop app (semantic.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -s '
            def bundle: .name | startswith("pardes-semantic.tar.zst");
            { generated_at: (now | todate),
              releases: [ add[] | select(.draft | not) | select(.tag_name | startswith("semantic-"))
                | {tag_name, prerelease, published_at, html_url,
                   assets: [.assets[] | select(bundle) | {name, size, browser_download_url, digest}]} ] }
          ' > _site/semantic.json
          jq -c '{generated_at, packs: [.releases[].tag_name]}' _site/semantic.json

      # Pardes for desktop's releases (their installers) and the semantic packs (their zips) newest first, and the
      # library's latest release (its bundle's files), in the API's shape too. The library is another repository's: the
      # page does without it when it can't be read.
      - name: Downloads for the page (downloads.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api repos/kdroidFilter/SeforimLibrary/releases/latest > "$RUNNER_TEMP/library.json" || echo '{}' > "$RUNNER_TEMP/library.json"
          jq -s --slurpfile library "$RUNNER_TEMP/library.json" '
            def installer: .name | test("\\.(exe|dmg|deb|rpm|pacman)$");
            def zip: .name == "pardes-model.zip" or .name == "pardes.vec.lucene.zip";
            def bundle: .name | startswith("seforim_bundle.tar.zst");
            def keep(f): [.assets[]? | select(f) | {name, size, browser_download_url}];
            { generated_at: (now | todate),
              releases: [ add[] | select(.draft | not) | select(.prerelease | not)
                | select(.tag_name | startswith("desktop-") or startswith("semantic-"))
                | {name, tag_name, prerelease, published_at, html_url,
                   assets: (if (.tag_name | startswith("desktop-")) then keep(installer) else keep(zip) end)} ],
              library: ($library[0] | if (.tag_name // null) then {tag_name, published_at, html_url, assets: keep(bundle)} else null end) }
          ' "$RUNNER_TEMP/releases.json" > _site/downloads.json
          jq -c '{generated_at, releases: [.releases[].tag_name], library: .library.tag_name}' _site/downloads.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
