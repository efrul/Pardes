name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The commits of the PR are read with the job's token, which this repository's defaults leave without
# pull-requests access (the check failed with 403 "Resource not accessible by integration")
permissions:
  contents: read
  pull-requests: read

jobs:
  dco-check:
    name: Check DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Verify Signed-off-by on all PR commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            const signOffRegex = /^Signed-off-by: .+ <.+@.+>$/m;
            const failures = [];

            // Zayit's own commits, brought by the merge of one of its releases ("Merge Zayit v<x.y.z> into Pardes"),
            // are its history as released: Pardes cannot sign them off without rewriting it, which the next merge of
            // Zayit would then meet again (d4aff54 in v0.6.12 has no sign-off). Pardes's own commits are checked.
            const bySha = new Map(commits.map((c) => [c.sha, c]));
            const upstream = new Set();
            for (const c of commits) {
              if (c.parents.length < 2 || !/^Merge Zayit v\d/.test(c.commit.message || "")) continue;
              const stack = c.parents.slice(1).map((p) => p.sha);
              while (stack.length > 0) {
                const sha = stack.pop();
                const commit = bySha.get(sha);
                if (!commit || upstream.has(sha)) continue;
                upstream.add(sha);
                stack.push(...commit.parents.map((p) => p.sha));
              }
            }

            for (const c of commits) {
              // A merge carries no sign-off of its own (GitHub's "Merge pull request" commits in Zayit's history,
              // merged here as released): the commits it brings are checked, a Zayit release's aside
              if (c.parents.length > 1 || upstream.has(c.sha)) continue;
              const message = c.commit.message || "";
              if (!signOffRegex.test(message)) {
                failures.push(`${c.sha.substring(0, 7)} — ${message.split("\n")[0]}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                "The following commits are missing a 'Signed-off-by' line " +
                "(see CONTRIBUTING.md, use `git commit -s`):\n\n" +
                failures.map((f) => `  - ${f}`).join("\n")
              );
            } else {
              core.info(`All ${commits.length - upstream.size} commit(s) of Pardes are signed off (${upstream.size} of Zayit's releases, merged as released, not checked).`);
            }
