name: Desktop tear-off test build

# Branch commentator-tearoff only: a Windows x64 installer of Pardes for desktop to try the commentators torn off the
# commentaries pane, as an Actions artifact. Not a release: no tag, no GitHub release, nothing installed apps read.
#
# The branch builds against efrul/Nucleus's commentator-tearoff (Modifier.satelliteTearOffHandle), which is not on
# Maven Central: the first job publishes it to Maven Local (its scripts/publish-tearoff-local.sh: decorated-window-tao
# from source with the natives of the jar it branched from, every other module copied from that release under the
# fork's version), and the Windows job builds with that repository. JVM packaging (jpackage + NSIS), not the GraalVM
# native image of the releases: quicker, and enough to try the feature.
#
# Community edition only, as desktop-release.yml: no token of Zayit's private add-ons and no GitHub token in a Gradle
# step (settings.gradle.kts would ask gh for one); branding/brand.gradle stops a build that would compile them.
on:
  push:
    branches: [commentator-tearoff]

permissions:
  contents: read

concurrency:
  group: desktop-tearoff-test
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NUCLEUS_REPO: efrul/Nucleus
  NUCLEUS_REF: commentator-tearoff
  NUCLEUS_VERSION: 3.0.0-dev-202610272317-1-tearoff

jobs:
  nucleus:
    name: Nucleus fork to Maven Local
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the Nucleus fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.NUCLEUS_REPO }}
          ref: ${{ env.NUCLEUS_REF }}
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          GRADLE_ARGS="--console=plain" scripts/publish-tearoff-local.sh "$NUCLEUS_VERSION"
          ls ~/.m2/repository/dev/nucleusframework

      - name: Upload the Maven Local repository
        uses: actions/upload-artifact@v6
        with:
          name: nucleus-maven-local
          path: ~/.m2/repository/dev/nucleusframework
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows x64 installer
    needs: nucleus
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check out SeforimLibrary
        run: git submodule update --init SeforimLibrary

      - name: Nucleus fork into Maven Local
        uses: actions/download-artifact@v7
        with:
          name: nucleus-maven-local
          path: ~/.m2/repository/dev/nucleusframework

      # The version of the top section of desktop/CHANGELOG.md, as the releases take it
      - name: Version
        run: |
          version="$(awk '/^## / { print $2; exit }' desktop/CHANGELOG.md)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "desktop/CHANGELOG.md has no version on top: $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Nucleus
        uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@712f1e520c73fd68e1e7514b17700e577643802c
        with:
          graalvm: false

      - name: Build the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $env:GITHUB_REF = "refs/tags/v$env:VERSION"
          .\gradlew.bat --console=plain :SeforimApp:createReleaseDistributable :SeforimApp:packageReleaseNsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'SeforimApp\build\compose\binaries\main-release\nsis'
          $found = @(Get-ChildItem -Path $dir -Filter '*-nsis.exe' -File)
          if ($found.Count -ne 1) { Write-Error "Expected one *-nsis.exe in $dir, found $($found.Count): $($found.Name -join ', ')" }
          New-Item -ItemType Directory -Force staging | Out-Null
          $short = "${{ github.sha }}".Substring(0, 7)
          Copy-Item $found[0].FullName "staging\Pardes-$env:VERSION-tearoff-$short-windows-x64-nsis.exe"
          Get-ChildItem staging

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: pardes-tearoff-windows-x64
          path: staging/*
          if-no-files-found: error
          retention-days: 14
