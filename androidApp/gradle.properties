org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true
# kosherkotlin-android 3.0.5 (desktop 0.6.10's zmanim engine) declares minCompileSdk 37 in its AAR metadata, so
# checkReleaseAarMetadata fails against compileSdk 36, the highest AGP 8.12 supports. Its classes link against API 33
# (R8 TraceReferences), so only the compileSdk part of the AAR metadata check is skipped; minSdk/AGP checks remain.
android.experimental.disableCompileSdkChecks=true
