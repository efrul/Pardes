// What makes this desktop build Pardes for desktop (פרדס למחשב) rather than Zayit: its name, ids, icons, texts and
// pictures, laid over upstream's SeforimApp/build.gradle.kts by that file's last line. Upstream's files keep Zayit's
// values, so merging a new Zayit release meets this one hook instead of a renamed app; see branding/README.md.
//
// -Pseforimapp.brand=zayit builds upstream's Zayit unchanged (branding/zayit), to check that the hooks still match.
// Groovy, not Kotlin: the Nucleus DSL is set by name, without its types on this script's classpath.
import io.github.kdroidfilter.buildsrc.BrandResources

def brand = (findProperty('seforimapp.brand') ?: 'pardes').toString()
def brandDir = rootProject.file("branding/$brand")
if (!brandDir.isDirectory()) throw new GradleException("Unknown brand '$brand': there is no branding/$brand")

// The brand's Kotlin (Brand.APP_ID, Brand.settings() and the other values the app reads at run time)
kotlin.sourceSets.jvmMain.kotlin.srcDir(new File(brandDir, 'kotlin'))

if (brand == 'zayit') return

def props = new Properties()
new File(brandDir, 'brand.properties').withReader('UTF-8') { props.load(it) }
def value = { String key ->
    def v = props.getProperty(key)
    if (v == null) throw new GradleException("branding/$brand/brand.properties has no $key")
    v
}

// Zayit's private add-ons (smart siddur, semantic search, quote links) are licensed to Zayit only: settings.gradle.kts
// turns them on when it finds a token, even a developer's gh login, and a Pardes build must never compile them
['siddurEnabled', 'semanticEnabled', 'quoteLinksEnabled'].each { flag ->
    def extra = gradle.extensions.extraProperties
    if (extra.has(flag) && extra.get(flag) == true) {
        throw new GradleException("$flag: Zayit's private add-ons are not for Pardes; build without their tokens")
    }
}

// Pardes's own smart siddur, in the place of Zayit's private one: addons/siddur/open, on the open engine vendored as
// :siddur-open (siddur-open/README.md), is compiled where upstream's script compiles addons/siddur/disabled. The app
// shows it only once the user turns it on in the settings (OpenSiddurSwitch)
def appSources = kotlin.sourceSets.jvmMain.kotlin
appSources.exclude { it.file.path.replace('\\', '/').contains('/addons/siddur/disabled/') }
appSources.srcDir('addons/siddur/open/kotlin')
kotlin.sourceSets.jvmMain.dependencies { implementation(project(':siddur-open')) }
kotlin.sourceSets.jvmTest.kotlin.srcDir('addons/siddur/open-test/kotlin')

// The reading of PDF files (request 28 of docs/DESKTOP_STAGE2.md), an experiment behind a hidden switch
// (features/pdf/PdfReaderTool.kt): Nucleus's binding of PDFium. Its JAR holds PDFium for every platform; the native
// image takes the Windows x64 one only (src/graalvm/reachability-metadata.json), the testers' builds being Windows ones
kotlin.sourceSets.jvmMain.dependencies { implementation('dev.nucleusframework:pdfium-jvm:159.0.8152.0') }

def app = nucleus.application
app.graalvm.imageName = value('imageName')

def dist = app.nativeDistributions
dist.appName = value('appName')
dist.packageName = value('packageName')
dist.description = value('description')
dist.vendor = value('vendor')
dist.copyright = value('copyright')
dist.homepage = value('homepage')
dist.publish.github.owner = value('publishOwner')
dist.publish.github.repo = value('publishRepo')
// No OS URL scheme: zayit:// belongs to Zayit, and two apps registering it would clash
dist.protocols.clear()
// No Microsoft Store package: upstream's appx { } is Zayit's own Store listing (KdroidFilter.Zayit, named זית)
dist.targetFormats = dist.targetFormats.findAll { it.name() != 'AppX' } as Set

dist.linux.debMaintainer = value('debMaintainer')
dist.linux.startupWMClass = value('startupWMClass')
dist.linux.iconFile.set(new File(brandDir, 'desktopAppIcons/LinuxIcon.png'))
// The launcher entry of every Linux package: an English Name and Comment, which Latin-layout launchers find, with the
// Hebrew ones as localized variants (upstream's map, linux { appImage { desktopEntries } }, names Zayit)
dist.linux.appImage.desktopEntries = [
    'Name'       : value('linuxName'),
    'Name[he]'   : value('appName'),
    'Comment'    : value('linuxComment'),
    'Comment[he]': value('description'),
]
dist.windows.iconFile.set(new File(brandDir, 'desktopAppIcons/WindowsIcon.ico'))
dist.windows.upgradeUuid = value('upgradeUuid')
dist.windows.nsis.shortcutName = value('appName')
// macOS: upstream's macOS { } is Zayit's bundle id, icon and app name (זית.app)
dist.macOS.iconFile.set(new File(brandDir, 'desktopAppIcons/MacosIcon.icns'))
dist.macOS.bundleID = value('macBundleId')
dist.macOS.packageName = value('appName')

// Texts upstream keeps elsewhere, copied next to the brand's licence texts (common/licenses) rather than duplicated:
// the app's own licence (Nucleus packages no licenseFile), the learning schedules' notice, the sky's credits and the
// notices of the open siddur's data (Amud's GPL v3, Hebcal's BSD)
def licenceCopies = [
    'Pardes-LICENSE.txt': rootProject.file('LICENSE'),
    'Limud-NOTICE.txt'  : file('src/jvmMain/resources/limud/NOTICE.txt'),
    'Sky-CREDITS.md'    : rootProject.file('earthwidget/src/commonMain/composeResources/files/CREDITS.md'),
    'GPL-3.0.txt'       : rootProject.file('siddur-open/COPYING.AMUD'),
    'Hebcal-LICENSE.txt': rootProject.file('siddur-open/COPYING.HEBCAL'),
]
licenceCopies.each { name, source ->
    if (!source.isFile()) throw new GradleException("$source is gone: update the licences in branding/brand.gradle")
}
def licences = tasks.register('brandLicences', Sync) {
    into(layout.buildDirectory.dir('brand/licences'))
    licenceCopies.each { name, source ->
        from(source) {
            into('common/licenses')
            rename(/.+/, name)
        }
    }
}

// The app's resources (strings, pictures, About and the terms) and its package-time assets (the splash), with the
// brand's files laid over upstream's. assetsExtra holds the brand's own files, added to upstream's: the licence texts
// of what the app bundles, shipped as plain files in the install folder (common/licenses) on every package
def composeResources = tasks.register('brandComposeResources', BrandResources) {
    base.set(layout.projectDirectory.dir('src/commonMain/composeResources'))
    def brandFiles = new File(brandDir, 'composeResources')
    if (brandFiles.isDirectory()) overlay.set(brandFiles)
    outputDir.set(layout.buildDirectory.dir('brand/composeResources'))
}
compose.resources.customDirectory('commonMain', composeResources.flatMap { it.outputDir })

def assets = tasks.register('brandAssets', BrandResources) {
    base.set(layout.projectDirectory.dir('src/jvmMain/assets'))
    def brandFiles = new File(brandDir, 'assets')
    if (brandFiles.isDirectory()) overlay.set(brandFiles)
    def brandExtra = new File(brandDir, 'assetsExtra')
    if (brandExtra.isDirectory()) extra.from(brandExtra)
    extra.from(licences)
    outputDir.set(layout.buildDirectory.dir('brand/assets'))
}
dist.appResourcesRootDir.set(assets.flatMap { it.outputDir })
