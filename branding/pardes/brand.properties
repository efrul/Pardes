# Pardes for desktop: the packaging values branding/brand.gradle sets in place of upstream Zayit's
# (SeforimApp/build.gradle.kts, nucleus.application). Read as UTF-8.
appName=פרדס
# Also the Linux launcher file's name (pardes.desktop): keep BrandInfo.LINUX_DESKTOP_FILE_ID (branding/pardes/kotlin) the same
packageName=pardes
imageName=pardes
description=פרדס, ללימוד התורה. מבוסס על זית מאת אליהו גמבש ואינו מטעמו
# The Linux launcher entry's English Name and Comment (Name[he] is appName, Comment[he] is description)
linuxName=Pardes
linuxComment=Torah study library, based on Zayit by Elie (Elyahou) Gambache and not made on his behalf
vendor=Pardes
homepage=https://github.com/efrul/Pardes
publishOwner=efrul
publishRepo=Pardes
# The installers' copyright (the Windows exe's LegalCopyright): his line, word for word, as everywhere Pardes names it;
# without it electron-builder writes "Copyright © <year> Pardes"
copyright=Copyright (C) 2025 Elie Gambache
debMaintainer=Pardes <342689225+efrul@users.noreply.github.com>
startupWMClass=pardes
# Made once for Pardes and never changed; never Zayit's (d9f21975-...), which would upgrade Zayit away
upgradeUuid=10ce5e89-0abf-4953-85af-ce36df89b623
