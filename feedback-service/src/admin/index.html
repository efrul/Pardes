<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>משוב פרדס</title>
<link rel="stylesheet" href="/admin/style.css">
<script src="/admin/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">פרדס</span>
    <span class="title">המשוב שנשלח</span>
  </div>
  <div class="actions" id="actions" hidden>
    <span id="status" class="muted" aria-live="polite"></span>
    <button id="refresh" type="button">רענון</button>
    <button id="download" type="button">הורדת הכול (JSON)</button>
    <button id="logout" type="button">יציאה</button>
  </div>
</header>
<main>
  <section id="login" class="card login">
    <h1>כניסה</h1>
    <p>כאן מוצג מה שמשתמשי פרדס שלחו לשירות המשוב. כדי לראות אותו צריך את קוד המנהל של השירות: הערך של הסוד
      <code>FEEDBACK_ADMIN_TOKEN</code>, שהשירות הוקם איתו.</p>
    <form id="login-form" autocomplete="on">
      <label for="token">קוד המנהל</label>
      <input id="token" name="password" type="password" autocomplete="current-password" required spellcheck="false" dir="ltr">
      <label class="check"><input id="remember" type="checkbox"> לזכור במכשיר הזה</label>
      <button type="submit" class="primary">כניסה</button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
  </section>
  <section id="app" hidden>
    <nav class="tabs" role="tablist" aria-label="מה להציג">
      <button type="button" role="tab" data-view="overview">סיכום</button>
      <button type="button" role="tab" data-view="searches">חיפושים</button>
      <button type="button" role="tab" data-view="grades">דירוגים</button>
      <button type="button" role="tab" data-view="daf">צורת הדף</button>
      <button type="button" role="tab" data-view="packages">חבילות</button>
    </nav>
    <div id="view" role="tabpanel"></div>
  </section>
</main>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<dialog id="raw" class="raw">
  <div class="raw-head">
    <strong id="raw-title"></strong>
    <button type="button" id="raw-close">סגירה</button>
  </div>
  <pre id="raw-body" dir="ltr"></pre>
</dialog>
</body>
</html>
