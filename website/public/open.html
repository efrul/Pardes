<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zayit</title>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fff; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #1e1f22; color: #ddd; } a { color: #8ab4f8; } }
  main { text-align: center; padding: 16px; }
</style>
</head>
<body>
<main>
  <p><a id="open" href="#">פתח בזית</a></p>
  <p><a href="/he/download/">זית אינו מותקן? להורדה</a></p>
</main>
<script>
  // The target travels in the fragment (#book/<id>/line/<id>), which never reaches the server
  var target = "zayit://" + location.hash.slice(1);
  document.getElementById("open").href = target;
  if (location.hash.length > 1) location.replace(target);
</script>
</body>
</html>
